<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f3; --card:#fff; --text:#14213d; --muted:#5c6470; --line:#ece7dd;
    --amber:#e8a33d; --amber-deep:#b9741c;
    --sun1:#ffd9a0; --sun2:rgba(255,217,160,0);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1524; --card:#18213a; --text:#f3efe7; --muted:#a3abbd; --line:#26314f;
      --amber:#f0b254; --amber-deep:#f0b254; 
      --sun1:rgba(240,178,84,.30); --sun2:rgba(240,178,84,0);
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
    background:radial-gradient(120% 340px at 50% 0,var(--sun1),var(--sun2)) no-repeat,var(--bg);
    color:var(--text); min-height:100vh; line-height:1.7;
  }
  .page{max-width:480px;margin:0 auto;padding:2.5rem 1.1rem 3rem}

  /* Identity */
  .identity{text-align:center;margin-bottom:2rem}
  .logo{
    width:92px;height:92px;margin:0 auto 1rem;border-radius:50%;padding:3px;
    background:conic-gradient(from 200deg,#8b3dff,#17c3b2,#8b3dff 55%,#17c3b2 80%,#8b3dff);
  }
  .logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg);background:var(--card)}
  h1{font-size:1.25rem;font-weight:800}
  .tag{font-size:.85rem;color:var(--muted);margin-top:2px}

  h2{
    display:flex;align-items:center;gap:8px;
    font-size:.8rem;font-weight:700;color:var(--amber-deep);
    margin:1.75rem .2rem .65rem;
  }
  h2::after{content:"";flex:1;height:1px;background:var(--line)}

  /* Social grid */
  .social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    text-decoration:none;color:var(--text);font-size:.88rem;font-weight:600;
  }
  .tile img{width:44px;height:44px;border-radius:12px;object-fit:contain;display:block}

  /* List */
  .list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;
    padding:16px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    text-decoration:none;color:var(--text);
  }
  .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
  .ico svg{width:22px;height:22px}
  .row span.t{font-size:.88rem;font-weight:600;line-height:1.5}

  .tile:hover,.row:hover{border-color:var(--amber)}
  .tile:active,.row:active{background:var(--line)}
  a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .c-blue{background:#e4effc;color:#1b67b0}
  .c-violet{background:#ece9fd;color:#5b4fcf}
  .c-green{background:#dcf2e8;color:#12805f}
  .c-teal{background:#ddf4f1;color:#0e8c82}
  .c-orange{background:#fdeadb;color:#c9672a}
  .c-lime{background:#e8f2dc;color:#568a1e}
  @media (prefers-color-scheme: dark){
    .c-blue{background:#1d2f4d;color:#7db8f0}
    .c-violet{background:#2a2750;color:#a79df5}
    .c-green{background:#173a30;color:#5fd0a4}
    .c-teal{background:#16393a;color:#58d1c6}
    .c-orange{background:#41291a;color:#f0a06a}
    .c-lime{background:#2a3a1b;color:#a5d36b}
  }

  footer{text-align:center;margin-top:2.25rem;font-size:.75rem;color:var(--muted)}
</style>
</head>
