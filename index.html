<style>
  :root{
    --ink:#14213D;
    --amber:#E8A33D;
    --amber-deep:#C9842A;
    --cream:#FAF7F2;
    --surface:#FFFFFF;
    --slate:#5C6470;
    --hairline:#ECE7DD;
    --teal:#2E8B7E;
    --violet:#8B3DFF;
    --turquoise:#17C3B2;
    --shadow-sm: 0 1px 2px rgba(20,33,61,0.04);
    --shadow-md: 0 6px 20px -8px rgba(20,33,61,0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
    background: linear-gradient(180deg, #FFE9C7 0%, #FFF3E0 22%, #FAF7F2 52%, #EEF5F3 100%);
    background-attachment: fixed;
    color: var(--ink);
    direction: rtl;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Sunrise background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  /* grid of fine dots, fading toward the bottom */
  .bg .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(20,33,61,0.13) 1px, transparent 1.2px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
            mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
  }

  /* the rising sun with expanding rings */
  .bg .sun {
    position: absolute;
    top: -230px; left: 50%;
    width: 560px; height: 560px;
    margin-left: -280px;
    border-radius: 50%;
    background:
      radial-gradient(circle, #FFD27A 0%, #F6B656 22%, rgba(246,182,86,0.55) 38%, transparent 62%),
      repeating-radial-gradient(circle, transparent 0 34px, rgba(232,163,61,0.22) 34px 35px);
    -webkit-mask-image: radial-gradient(circle, #000 55%, transparent 71%);
            mask-image: radial-gradient(circle, #000 55%, transparent 71%);
    animation: rise 9s ease-in-out infinite alternate;
  }
  @keyframes rise {
    from { transform: translateY(14px) scale(0.97); opacity: 0.85; }
    to   { transform: translateY(-4px) scale(1.03); opacity: 1; }
  }

  /* slow drifting colour blobs */
  .bg .orb { position: absolute; border-radius: 50%; filter: blur(46px); animation: drift 16s ease-in-out infinite alternate; }
  .bg .o1 { width: 300px; height: 300px; top: 30%; right: -110px; background: rgba(139,61,255,0.14); }
  .bg .o2 { width: 340px; height: 340px; top: 52%; left: -130px; background: rgba(23,195,178,0.20); animation-delay: -5s; }
  .bg .o3 { width: 280px; height: 280px; bottom: -90px; right: 8%; background: rgba(232,163,61,0.22); animation-delay: -9s; }
  @keyframes drift {
    from { transform: translate(0,0); }
    to   { transform: translate(-26px,34px); }
  }

  /* layered hills at the bottom */
  .bg .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; }
  .bg .hills svg { width: 100%; height: 100%; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .bg .sun, .bg .orb { animation: none; }
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 2.75rem 1.1rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* ---------- Header / Identity ---------- */
  .identity { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 2.4rem; }
  .logo-ring { position: relative; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem; }
  .logo-ring::before {
    content: ""; position: absolute; inset: 3px; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--violet), var(--turquoise), var(--violet) 55%, var(--turquoise) 80%, var(--violet) 100%);
  }
  .logo-ring::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%;
    box-shadow: 0 10px 26px -6px rgba(139,61,255,0.4), 0 10px 26px -6px rgba(23,195,178,0.35);
  }
  .logo-circle { position: relative; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; border: 3px solid var(--cream); background: var(--surface); z-index: 1; }
  .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-name { font-size: 19px; font-weight: 800; letter-spacing: 0.2px; }
  .brand-tag { margin-top: 4px; font-size: 12.5px; font-weight: 500; color: var(--slate); }

  /* ---------- Section labels ---------- */
  .section-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--amber-deep); letter-spacing: 0.8px; margin: 2.1rem 0.2rem 0.7rem; }
  .section-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to left, rgba(201,132,42,0.3), transparent); }

  /* ---------- Link cards ---------- */
  .links-grid { display: flex; flex-direction: column; gap: 9px; }
  .link-card {
    display: flex; align-items: center; gap: 13px; padding: 12px 14px;
    background: rgba(255,255,255,0.86);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(236,231,221,0.9);
    border-radius: 16px; text-decoration: none; color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .link-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: #E2DACB; }
  .link-card:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
  .link-card:focus-visible { outline: 2px solid var(--amber-deep); outline-offset: 2px; }

  .icon-wrap { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .icon-wrap svg, .icon-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon-wrap svg { padding: 9px; }
  .tg img { object-fit: contain; }
  .tg   { background: transparent; }
  .msg  { background: linear-gradient(135deg,#EAF3FF,#F3F8FF); }
  .ig   { background: linear-gradient(135deg,#F6E4ED,#FBEAF0); }
  .tiktok { background: linear-gradient(135deg,#E9F7F5,#F4EAF7); }
  .blog { background: linear-gradient(135deg,#EFEDFE,#F6F5FF); }
  .info { background: linear-gradient(135deg,#E4F6EF,#EFFAF5); }
  .srv  { background: linear-gradient(135deg,#E3F6F5,#EEFAF9); }
  .prt  { background: linear-gradient(135deg,#FDEBDD,#FFF3E8); }
  .ph   { background: linear-gradient(135deg,#EEF6E9,#F5F9EE); }

  .link-title { font-size: 14.5px; font-weight: 600; flex: 1; }
  .chevron { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chevron svg { width: 16px; height: 16px; color: #C7C2B6; transition: transform 0.16s ease, color 0.16s ease; }
  .link-card:hover .chevron svg { transform: translateX(-2px); color: var(--amber-deep); }

  .footer-note { text-align: center; margin-top: 2.6rem; font-size: 11.5px; color: #8F8A80; letter-spacing: 0.2px; }

  @media (prefers-reduced-motion: reduce) { .link-card, .chevron svg { transition: none; } }
</style>
