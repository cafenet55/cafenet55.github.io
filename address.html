<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>آدرس | کافی‌نت طلوع سبزوار</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800&display=swap');
  :root{
    --petrol:#0e2b30; --petrol2:#173f42; --brass:#c9a35c; --stone:#f3f4f1;
    --ink:#14201f; --muted:#5c6a68; --line:#dce1dd; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--stone);color:var(--ink);line-height:1.8;}
  a{color:inherit;}
  a:focus-visible{outline:3px solid var(--brass);outline-offset:4px;}
  .container{max-width:1040px;margin:0 auto;padding:0 24px;}

  /* Hero */
  .hero{
    position:relative;overflow:hidden;color:var(--white);
    background:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,
      linear-gradient(165deg,var(--petrol2),var(--petrol) 70%);
    padding-bottom:96px;
  }
  .hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 60%,transparent 0,var(--petrol) 85%);opacity:.55;pointer-events:none;}
  .hero .container{position:relative;z-index:1;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 0;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.05rem;text-decoration:none;}
  .brand i{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);position:relative;overflow:hidden;}
  .brand i::after{content:'';position:absolute;left:50%;bottom:-9px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--brass);}
  .top-link{font-size:.9rem;font-weight:500;text-decoration:none;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.28);border-radius:100px;padding:7px 18px;transition:background .2s,color .2s;}
  .top-link:hover{background:var(--white);color:var(--petrol);}
  .hero-body{display:flex;align-items:center;justify-content:space-between;gap:30px;padding-top:70px;}
  .hero h1{font-size:clamp(2.2rem,6vw,3.9rem);font-weight:300;line-height:1.35;letter-spacing:-.5px;}
  .hero h1 b{font-weight:800;display:block;}
  .hero p{margin-top:14px;font-size:1.05rem;color:rgba(255,255,255,.7);font-weight:400;max-width:34ch;}
  .marker{position:relative;flex-shrink:0;width:150px;height:150px;display:grid;place-items:center;}
  .marker::before,.marker::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--brass);animation:ping 3.2s ease-out infinite;}
  .marker::after{animation-delay:1.6s;}
  .marker span{width:46px;height:46px;border-radius:50%;background:var(--brass);display:grid;place-items:center;}
  .marker svg{width:22px;height:22px;fill:var(--petrol);}
  @keyframes ping{from{transform:scale(.35);opacity:.9}to{transform:scale(1);opacity:0}}
  @media(max-width:640px){.marker{display:none;}.hero-body{padding-top:44px;}}

  /* Address panel */
  .panel{
    position:relative;z-index:2;margin-top:-56px;background:var(--white);border-radius:24px;
    box-shadow:0 30px 60px -34px rgba(14,43,48,.5);
    display:grid;grid-template-columns:1.4fr 1fr;
  }
  @media(max-width:760px){.panel{grid-template-columns:1fr;}}
  .addr{padding:38px 40px;}
  .label{font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:6px;}
  .addr strong{display:block;font-size:clamp(1.2rem,3.6vw,1.65rem);font-weight:600;line-height:1.8;}
  .nav{padding:38px 40px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-inline-start:1px solid var(--line);}
  @media(max-width:760px){.nav{border-inline-start:0;border-top:1px solid var(--line);padding-top:28px;}.addr{padding-bottom:28px;}}
  .map-btn{
    display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;
    background:var(--petrol);color:var(--white);border-radius:100px;padding:10px 12px 10px 24px;
    font-weight:600;transition:background .2s;
  }
  .map-btn:hover{background:var(--petrol2);}
  .map-btn em{width:44px;height:44px;border-radius:50%;background:var(--brass);display:grid;place-items:center;transition:transform .25s;}
  .map-btn:hover em{transform:translateX(-4px);}
  .map-btn svg{width:20px;height:20px;stroke:var(--petrol);}
  .hint{font-size:.82rem;color:var(--muted);text-align:center;}

  /* Sections */
  section.block{margin-top:72px;}
  .block h2{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:26px;font-size:1.2rem;font-weight:600;}
  .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media(max-width:560px){.img-grid{grid-template-columns:1fr;}}
  figure img{width:100%;display:block;border-radius:18px;background:var(--line);aspect-ratio:4/3;object-fit:cover;}
  figcaption{margin-top:10px;font-size:.92rem;color:var(--muted);font-weight:500;}
  .video-card{border-radius:22px;overflow:hidden;background:var(--petrol);box-shadow:0 30px 60px -36px rgba(14,43,48,.6);}
  .video-inner{position:relative;padding-bottom:56.25%;height:0;}
  .video-inner>div,.video-inner iframe{position:absolute!important;top:0!important;left:0!important;width:100%!important;height:100%!important;border:none;}

  footer{margin-top:80px;padding:34px 0 44px;border-top:1px solid var(--line);}
  footer .container{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  footer small{color:var(--muted);font-size:.88rem;}
  .back-btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:.95rem;border:1.5px solid var(--ink);border-radius:100px;padding:10px 24px;transition:background .2s,color .2s;}
  .back-btn:hover{background:var(--ink);color:var(--white);}
  .back-btn svg{width:18px;height:18px;fill:currentColor;}

  @media(prefers-reduced-motion:reduce){.marker::before,.marker::after{animation:none;opacity:.4;transform:none;}.map-btn em{transition:none;}}
</style>
</head>
<body>
<header class="hero">
  <div class="container">
    <nav class="topbar">
      <a class="brand" href="/"><i aria-hidden="true"></i>کافی‌نت طلوع</a>
      <a class="top-link" href="/">صفحه اصلی</a>
    </nav>
    <div class="hero-body">
      <div>
        <h1>آدرس و<b>لوکیشن ما</b></h1>
        <p>کافی‌نت طلوع سبزوار؛ پیدا کردن ما آسان است.</p>
      </div>
      <div class="marker" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></span></div>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div class="addr">
      <div class="label">نشانی دقیق</div>
      <strong>سبزوار؛ چهارراه استثنایی، نبش طالقانی ۱۹٫۱</strong>
    </div>
    <div class="nav">
      <a rel="nofollow" href="https://www.google.com/maps/place/Tolue+Sabzevar+Internet+Cafe/@36.2196939,57.6766982,17z" target="_blank" class="map-btn">
        باز کردن در گوگل مپ
        <em><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></em>
      </a>
      <div class="hint">مسیریابی آنلاین مستقیم از موبایل شما</div>
    </div>
  </div>

  <section class="block">
    <h2>تصاویر موقعیت</h2>
    <div class="img-grid">
      <figure><img src="https://i.imgur.com/1f6D9J5.jpeg" loading="lazy" alt="نقشه موقعیت"/><figcaption>نقشه محله</figcaption></figure>
      <figure><img src="https://i.imgur.com/1B0ohQu.png" loading="lazy" alt="درب ورودی"/><figcaption>درب ورودی</figcaption></figure>
    </div>
  </section>

  <section class="block">
    <h2>ویدیوی مسیر</h2>
    <div class="video-card">
      <div class="video-inner">
        <div id="50427964749">
          <script type="text/JavaScript" src="https://www.aparat.com/embed/yjna084?data[rnddiv]=50427964749&data[responsive]=yes"></script>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <small>کافی‌نت طلوع سبزوار</small>
    <a class="back-btn" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>بازگشت به صفحه اصلی</a>
  </div>
</footer>
</body>
</html>
