<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>آدرس | کافی‌نت طلوع سبزوار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f1; --card:#fff; --ink:#0f2b28; --muted:#58706c; --line:#d3dfdb;
    --green:#0f5c52; --green-d:#0a3a35; --on-green:#eafaf4; --tint:#d8efe8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a1412; --card:#12201d; --ink:#e6f4ef; --muted:#93aaa5; --line:#1f3430;
      --green:#2fb59f; --green-d:#0b2e2b; --on-green:#04201b; --tint:#16332e;
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.8;min-height:100vh;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  .wrap{max-width:560px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
  a{color:inherit}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;margin-bottom:2rem}
  .top a{color:var(--muted);text-decoration:none}
  .top a:hover{color:var(--ink)}

  h1{font-size:clamp(2rem,9vw,2.6rem);font-weight:800;line-height:1.3;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.95rem;margin:.5rem 0 1.75rem}

  /* Address card */
  .place{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1.25rem}
  .addr{display:flex;align-items:center;gap:14px;margin-bottom:1.1rem}
  .pin{width:54px;height:54px;border-radius:16px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex-shrink:0}
  .pin svg{width:28px;height:28px}
  .addr small{display:block;font-size:.78rem;color:var(--muted)}
  .addr strong{display:block;font-size:1.05rem;font-weight:700;line-height:1.7}
  .map{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    text-decoration:none;background:var(--green);color:var(--on-green);
    border-radius:16px;padding:13px 16px;font-weight:700;
  }
  .map small{display:block;font-size:.75rem;font-weight:400;opacity:.85}
  .map svg{width:22px;height:22px;flex-shrink:0}
  .map:active{transform:scale(.985)}

  h2{display:flex;align-items:center;gap:12px;font-size:.95rem;font-weight:700;margin:2rem .2rem .8rem}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}

  /* Photos */
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);cursor:zoom-in;font:inherit;color:inherit;text-align:center}
  .shot img{display:block;width:100%;height:auto}
  .shot span{display:block;padding:6px;font-size:.82rem;font-weight:700}

  /* Video (loads only on tap) */
  .video{position:relative;border-radius:20px;overflow:hidden;background:var(--green-d);aspect-ratio:16/9}
  .video>div{position:absolute!important;inset:0;width:100%!important;height:100%!important}
  .video iframe{position:absolute!important;top:0!important;left:0!important;width:100%!important;height:100%!important;border:0}
  .facade{
    position:absolute;inset:0;width:100%;border:0;cursor:pointer;font:inherit;color:#eafaf4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(135deg,#17705f,#0a3a35);
  }
  .facade i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
  .facade svg{width:28px;height:28px;margin-right:-3px}
  .facade b{font-size:.95rem}

  .home{display:flex;justify-content:center;margin-top:2.25rem}
  .home a{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:.9rem;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 22px;
  }
  .home a:hover{border-color:var(--green)}
  .home svg{width:18px;height:18px}

  /* Lightbox */
  dialog{border:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%;margin:0;padding:20px}
  dialog::backdrop{background:rgba(5,14,12,.9)}
  dialog[open]{display:grid;place-items:center}
  dialog img{max-width:min(1100px,100%);max-height:100%;border-radius:12px;display:block}
  .close{position:fixed;top:16px;left:16px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:grid;place-items:center}
  .close svg{width:20px;height:20px;stroke:#0f2b28;stroke-width:2.5;stroke-linecap:round}

  a:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:3px}
  @media (max-width:420px){.shots{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">

  <nav class="top">
    <span>موقعیت مکانی</span>
    <a href="/">صفحه اصلی ›</a>
  </nav>

  <h1>آدرس و لوکیشن ما</h1>
  <p class="sub">کافی‌نت طلوع سبزوار؛ پیدا کردن ما آسان است</p>

  <section class="place">
    <div class="addr">
      <div class="pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></div>
      <div>
        <small>نشانی دقیق</small>
        <strong>سبزوار؛ چهارراه استثنایی، نبش طالقانی ۱۹٫۱</strong>
      </div>
    </div>
    <a class="map" rel="nofollow noopener" target="_blank" href="https://maps.app.goo.gl/sno51mqrbBTzeV1B6">
      <span>باز کردن در گوگل مپ<small>مسیریابی آنلاین مستقیم از موبایل شما</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
  </section>

  <h2>تصاویر موقعیت</h2>
  <div class="shots">
    <button class="shot" type="button" data-full="https://i.imgur.com/1f6D9J5.jpeg" aria-label="بزرگ‌نمایی نقشه محله">
      <img src="https://i.imgur.com/1f6D9J5.jpeg" alt="نقشه موقعیت" loading="lazy" decoding="async"><span>نقشه محله</span>
    </button>
    <button class="shot" type="button" data-full="https://i.imgur.com/1B0ohQu.png" aria-label="بزرگ‌نمایی درب ورودی">
      <img src="https://i.imgur.com/1B0ohQu.png" alt="درب ورودی" loading="lazy" decoding="async"><span>درب ورودی</span>
    </button>
  </div>

  <h2>ویدیوی مسیر</h2>
  <div class="video">
    <div id="50427964749"></div>
    <button class="facade" type="button" id="play" aria-label="پخش ویدیوی مسیر">
      <i><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></i>
      <b>پخش ویدیوی مسیر</b>
    </button>
  </div>

  <div class="home">
    <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>بازگشت به صفحه اصلی</a>
  </div>
</main>

<dialog id="lb" aria-label="نمایش تصویر">
  <button class="close" type="button" aria-label="بستن"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <img alt="">
</dialog>

<script>
(function(){
  var lb=document.getElementById("lb"),img=lb.querySelector("img");
  document.querySelectorAll(".shot").forEach(function(b){
    b.addEventListener("click",function(){
      img.src=b.dataset.full;img.alt=b.querySelector("img").alt;lb.showModal();
    });
  });
  lb.addEventListener("click",function(){lb.close()});

  // Aparat player is loaded only when the visitor taps play
  var p=document.getElementById("play");
  p.addEventListener("click",function(){
    var s=document.createElement("script");
    s.src="https://www.aparat.com/embed/yjna084?data[rnddiv]=50427964749&data[responsive]=yes";
    document.getElementById("50427964749").appendChild(s);
    p.remove();
  });
})();
</script>
</body>
</html>
