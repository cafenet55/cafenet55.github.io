<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حمایت از کافی‌نت طلوع سبزوار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1f7; --ink:#14173f; --muted:#5d6086; --line:#dcd8e8; --surface:#fff;
  --sun:#f6a93b; --sun2:#e0701f; --night:#14173f; --night2:#2d3278; --focus:#e0701f;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c0f2b;--ink:#fff2dd;--muted:#a9acd2;--line:#272b62;--surface:#151946;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c0f2b;--ink:#fff2dd;--muted:#a9acd2;--line:#272b62;--surface:#151946;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.9;overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 48px}

/* entrance */
.up{opacity:0;transform:translateY(22px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}

/* scene */
.scene{position:relative;border-radius:26px;overflow:hidden;background:#12163f;aspect-ratio:440/310;box-shadow:0 24px 50px -28px rgba(20,23,63,.8)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dawn{opacity:0;animation:fade 3.6s .2s ease-out forwards}
.stars{animation:fadeout 3.4s .6s ease-in forwards}
.star{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
@keyframes fade{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.sun{transform:translateY(150px);animation:rise 3s .3s cubic-bezier(.16,.84,.3,1) forwards}
@keyframes rise{to{transform:none}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.14);opacity:.8}}
.rays{transform-origin:220px 205px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{opacity:.75;animation:drift 26s linear infinite}
.cloud.b{animation-duration:38s;animation-delay:-14s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.h1{animation:sway 9s ease-in-out infinite alternate}
.h2{animation:sway 12s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.tag{position:absolute;top:16px;right:16px;z-index:2;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#fff7ea;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);padding:6px 12px;border-radius:40px}
.tag i{width:7px;height:7px;border-radius:50%;background:#ffd27a;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,210,122,.8)}100%{box-shadow:0 0 0 9px rgba(255,210,122,0)}}

/* headline */
h1{font-size:clamp(32px,9.6vw,42px);font-weight:900;line-height:1.3;text-align:center;margin:26px 0 8px;letter-spacing:-.01em}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .12em}
h1 .w b{display:inline-block;font-weight:inherit;transform:translateY(110%);animation:word .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(1.1s + var(--i)*.12s)}
@keyframes word{to{transform:none}}
.sub{text-align:center;color:var(--muted);font-size:14.5px;max-width:34ch;margin:0 auto 22px}

/* ticker */
.ticker{overflow:hidden;border-block:1px solid var(--line);padding:6px 0;margin-bottom:24px;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker div{display:flex;gap:28px;width:max-content;animation:tick 22s linear infinite;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ticker span::after{content:'✦';color:var(--sun);margin-inline-start:28px}
@keyframes tick{to{transform:translateX(50%)}}

/* card */
.stage{perspective:900px}
.card{position:relative;display:block;width:100%;border:0;font:inherit;text-align:right;cursor:pointer;color:#fff7ea;border-radius:22px;padding:22px;overflow:hidden;
  background:linear-gradient(145deg,var(--night2),var(--night) 70%);box-shadow:0 22px 40px -22px rgba(20,23,63,.9);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,214,140,.32),transparent 60%);pointer-events:none}
.card::after{content:'';position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:sheen 5s 2.5s ease-in-out infinite}
@keyframes sheen{0%{left:-80px}35%,100%{left:120%}}
.orb{position:absolute;left:-40px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 36%,transparent 38%);opacity:.9}
.ctop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;opacity:.85;position:relative}
.chip{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f6d38b,#d8a24a)}
.num{display:flex;direction:ltr;justify-content:flex-start;gap:.9em;margin:26px 0 18px;font-size:clamp(18px,5.4vw,22px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.06em;position:relative}
.owner{display:block;font-size:14px;position:relative}
.owner small{display:block;font-size:11px;opacity:.65}

.copy{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px;transition:border-color .2s,background .2s}
.copy:hover{border-color:var(--sun)}
.copy svg{width:20px;height:20px}
.copy .tick{stroke-dasharray:24;stroke-dashoffset:24}
.copy.done{border-color:var(--sun2);background:color-mix(in srgb,var(--sun) 16%,var(--surface))}
.copy.done .ic{display:none}
.copy.done .tick{animation:draw .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.copy .tick,.copy.done .ic{display:none}
.copy.done .tick{display:block}

.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:13px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

.go{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#2a1700;background:var(--sun);border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;animation:pulse 2.8s ease-out infinite}
.go::after{content:'';position:absolute;top:0;bottom:0;width:50px;left:-70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 3.6s 1s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,169,59,.55)}70%,100%{box-shadow:0 0 0 14px rgba(246,169,59,0)}}
.go small{display:block;font-size:12px;font-weight:500;opacity:.75}
.go svg{width:22px;height:22px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-6px)}}

.foot{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
.foot a{display:inline-block;margin-top:6px;color:var(--ink);font-weight:700;text-underline-offset:5px;text-decoration-color:var(--sun2)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .up,.dawn{opacity:1;transform:none}.stars{opacity:0}.sun{transform:none}h1 .w b{transform:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap">

  <div class="scene up">
    <span class="tag"><i></i>کافی‌نت طلوع سبزوار</span>
    <svg viewBox="0 0 440 310" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3278"/><stop offset=".55" stop-color="#b8527a"/><stop offset=".85" stop-color="#f6a93b"/><stop offset="1" stop-color="#ffd993"/></linearGradient>
        <radialGradient id="gl"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a3"/><stop offset="1" stop-color="#f08a2c"/></linearGradient>
      </defs>
      <rect width="440" height="310" fill="#12163f"/>
      <rect class="dawn" width="440" height="310" fill="url(#dawn)"/>
      <g class="stars" id="stars" fill="#fff"></g>
      <g class="sun">
        <circle class="glow" cx="220" cy="205" r="130" fill="url(#gl)"/>
        <g class="rays" id="rays" stroke="#ffe3a3" stroke-width="3" stroke-linecap="round" opacity=".6"></g>
        <circle cx="220" cy="205" r="56" fill="url(#sg)"/>
      </g>
      <rect class="cloud" x="40" y="70" width="90" height="12" rx="6" fill="#fff"/>
      <rect class="cloud" x="62" y="60" width="50" height="12" rx="6" fill="#fff"/>
      <rect class="cloud b" x="150" y="110" width="110" height="10" rx="5" fill="#fff"/>
      <g class="h1"><path d="M-30 250C50 200 120 215 190 245S330 235 480 215V320H-30Z" fill="#4a3f8c"/></g>
      <g class="h2"><path d="M-30 275C60 235 150 255 230 270S380 250 480 262V320H-30Z" fill="#2a2d72"/></g>
      <path d="M0 295C90 275 170 292 250 288S390 276 440 286V310H0Z" fill="#12163f"/>
    </svg>
  </div>

  <h1 aria-label="طلوع هنوز ادامه دارد"><span class="w" style="--i:0"><b>طلوع</b></span> <span class="w" style="--i:1"><b>هنوز</b></span> <span class="w" style="--i:2"><b>ادامه</b></span> <span class="w" style="--i:3"><b>دارد</b></span></h1>
  <p class="sub up" style="--d:1.7s">کافی‌نت طلوع سبزوار با حمایت شما روشن می‌ماند. هر مبلغی کمک می‌کند.</p>

  <div class="ticker up" style="--d:1.9s" aria-hidden="true"><div id="tk"></div></div>

  <section class="up" style="--d:2.1s" aria-label="پرداخت">
    <div class="stage">
      <button class="card" type="button" id="card" aria-label="کپی شماره کارت ۵۰۴۱۷۲۱۲۲۸۰۶۹۷۷۰">
        <span class="orb"></span>
        <span class="ctop"><span>کارت به کارت</span><span class="chip"></span></span>
        <span class="num" id="num" aria-hidden="true"></span>
        <span class="owner"><small>به نام</small>سید محمدرضا طلوع مقدم سبزوار</span>
      </button>
    </div>

    <button class="copy" type="button" id="copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ic"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></g><path class="tick" d="M5 13l4 4L19 7"/></svg>
      <span id="lbl">کپی شماره کارت</span>
    </button>

    <div class="or">یا</div>

    <a class="go" rel="nofollow noopener" href="https://daramet.com/cafenet55" target="_blank">
      <span>پرداخت آنلاین<small>از طریق درگاه دارمت</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
  </section>

  <footer class="foot up" style="--d:2.4s">سپاس از همراهی شما<br><a href="/">بازگشت به صفحه اصلی</a></footer>
</main>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg", CARD="5041721228069770";
  var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}

  // rays
  var r=document.getElementById("rays");
  for(var i=0;i<16;i++){var t=i*Math.PI/8,l=i%2?24:38,c=Math.cos(t),s=Math.sin(t);
    el("line",{x1:220+c*72,y1:205+s*72,x2:220+c*(72+l),y2:205+s*(72+l)},r)}
  // stars
  var sg=document.getElementById("stars"),seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  for(i=0;i<26;i++){var st=el("circle",{cx:rnd()*440,cy:rnd()*150,r:.8+rnd()*1.3},sg);st.setAttribute("class","star");st.style.animationDelay=(-rnd()*2.4)+"s"}
  // ticker
  var words=["سپاس از همراهی شما","هر حمایت یک قدم است","طلوع با شما روشن می‌ماند"],h="";
  for(i=0;i<8;i++)h+="<span>"+words[i%3]+"</span>";
  document.getElementById("tk").innerHTML=h;

  // card digits with scramble
  var num=document.getElementById("num"),groups=[],g;
  for(i=0;i<4;i++){g=document.createElement("span");g.textContent=CARD.substr(i*4,4);num.appendChild(g);groups.push(g)}
  function scramble(){
    groups.forEach(function(el,gi){
      var real=CARD.substr(gi*4,4),t0=performance.now(),dur=900+gi*260;
      (function tick(now){
        var p=Math.min(1,(now-t0)/dur),out="";
        for(var k=0;k<4;k++)out+=p>(k+1)/5?real[k]:Math.floor(Math.random()*10);
        el.textContent=p>=1?real:out;
        if(p<1)requestAnimationFrame(tick)
      })(t0)
    })
  }
  if(!still){groups.forEach(function(x){x.textContent="0000"});setTimeout(scramble,2300)}

  // tilt
  var card=document.getElementById("card");
  card.addEventListener("pointermove",function(e){
    if(still)return;var b=card.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
    card.style.setProperty("--ry",((x-.5)*-14)+"deg");card.style.setProperty("--rx",((y-.5)*10)+"deg");
    card.style.setProperty("--mx",x*100+"%");card.style.setProperty("--my",y*100+"%")});
  card.addEventListener("pointerleave",function(){card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg")});

  // confetti
  var cv=document.getElementById("fx"),cx=cv.getContext("2d"),ps=[],run=false;
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
  size();addEventListener("resize",size);
  function burst(x,y){
    if(still)return;var cols=["#f6a93b","#ffd27a","#e0701f","#fff2dd","#8f94e8"];
    for(var k=0;k<44;k++){var a=Math.random()*Math.PI*2,v=3+Math.random()*6;
      ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:3+Math.random()*4,c:cols[k%5],l:1})}
    if(!run){run=true;requestAnimationFrame(frame)}
  }
  function frame(){
    cx.clearRect(0,0,cv.width,cv.height);var d=devicePixelRatio;
    ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.l-=.017;
      if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x*d,p.y*d,p.s*d*p.l,0,7);cx.fill();return true});
    if(ps.length)requestAnimationFrame(frame);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
  }

  // copy
  var btn=document.getElementById("copy"),lbl=document.getElementById("lbl"),orig=lbl.textContent,tm;
  function ok(src){
    var b=src.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2);
    lbl.textContent="کپی شد";btn.classList.add("done");btn.setAttribute("aria-live","polite");
    clearTimeout(tm);tm=setTimeout(function(){lbl.textContent=orig;btn.classList.remove("done")},2200)
  }
  function fb(src){var t=document.createElement("textarea");t.value=CARD;t.style.cssText="position:fixed;left:-9999px;top:0";
    document.body.appendChild(t);t.select();try{document.execCommand("copy");ok(src)}catch(e){}document.body.removeChild(t)}
  function copy(src){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(CARD).then(function(){ok(src)}).catch(function(){fb(src)});
    else fb(src)
  }
  btn.addEventListener("click",function(){copy(btn)});
  card.addEventListener("click",function(){copy(card)});
})();
</script>
</body>
</html>
