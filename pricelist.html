  /* ===== Header ===== */

    position: sticky;
    top:0;
    z-index:50;
    background: linear-gradient(180deg, var(--teal-deep), var(--teal));
    color:#eef1ec;
    padding: 22px 20px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .header-inner{
    max-width:980px;
    margin:0 auto;
  }
  .eyebrow-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    font-size:26px;
    font-weight:800;
    letter-spacing:.2px;
  }
  .brand span{
    color:#e7c08a;
  }
  .subtitle{
    font-size:13.5px;
    opacity:.82;
    margin-top:4px;
  }
  .year-badge{
    background:#e7c08a;
    color:#3a2411;
    font-weight:700;
    font-size:13px;
    padding:6px 14px;
    border-radius:999px;
    white-space:nowrap;
  }
  .search-wrap{
    margin-top:16px;
    position:relative;
  }
  #search{
    width:100%;
    padding:13px 46px 13px 16px;
    border-radius:10px;
    border:none;
    font-family:inherit;
    font-size:15px;
    background:#f7f8f4;
    color:var(--ink);
    outline: 2px solid transparent;
    transition: outline-color .15s ease;
  }
  #search:focus{
    outline-color:#e7c08a;
  }
  .search-icon{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
    pointer-events:none;
    font-size:16px;
  }
  .result-count{
    font-size:12.5px;
    opacity:.75;
    margin-top:8px;
  }

  /* ===== Category nav ===== */
  nav.cats{
    max-width:980px;
    margin:18px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .cat-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:7px 14px;
    border-radius:999px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .cat-btn:hover{ border-color:var(--brass); }
  .cat-btn.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#f2efe6;
  }

    max-width:980px;
    margin:0 auto;

  section.group{
    margin-bottom:34px;
  }

  .group-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--teal);

  .group-title{
    font-size:17px;
    font-weight:700;
    color:var(--teal-deep);
  }
  .group-count{
    font-size:12px;
    color:#6b7770;
    background:var(--paper-2);
    padding:2px 9px;
    border-radius:999px;
  }

  .items{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .item.hidden{ display:none; }
  .row-badge{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:8px;
    background:var(--teal-deep);
    color:#eef1ec;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    font-weight:700;
    margin-top:2px;
  }
  .item-body{
    flex:1 1 auto;
    min-width:0;
  }
  .lines{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  .line-label{
    font-size:14.5px;
    color:var(--ink);
  }

    background: #f3d9ab;
    color:#3a2411;
    padding:0 3px;
    border-radius:3px;
  }
  .line-price{
    font-weight:700;
    color:var(--brass-deep);

    white-space:nowrap;
  }

    color:var(--red);
  }
  .note{
    font-size:12px;
    color:#6b7770;
    margin-top:6px;
  }

  }

    font-size:14px;

  }

function formatPrice(p){
  if (typeof p === "string") return p;
  return p.toLocaleString('fa-IR') + " ریال";
}
function toFaDigits(n){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(n).replace(/[0-9]/g, d => map[d]);
}

const main = document.getElementById('main');
const catsNav = document.getElementById('cats');
const searchInput = document.getElementById('search');
const resultCount = document.getElementById('resultCount');
const noResult = document.getElementById('noResult');

let activeCat = "all";

function countItems(){
  return DATA.reduce((sum,g)=>sum+g.items.length,0);
}

function renderCats(){
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn active';
  allBtn.textContent = 'همه (' + toFaDigits(countItems()) + ')';
  allBtn.dataset.key = 'all';
  catsNav.appendChild(allBtn);

  DATA.forEach(g=>{
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = g.title;
    btn.dataset.key = g.key;
    catsNav.appendChild(btn);
  });

  catsNav.addEventListener('click', (e)=>{
    const btn = e.target.closest('.cat-btn');
    if(!btn) return;
    activeCat = btn.dataset.key;
    [...catsNav.children].forEach(b=>b.classList.toggle('active', b===btn));
    applyFilter();
  });
}

function renderItems(){
  DATA.forEach(g=>{
    const section = document.createElement('section');
    section.className = 'group';
    section.dataset.key = g.key;

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<span class="group-title">${g.title}</span><span class="group-count">${toFaDigits(g.items.length)} مورد</span>`;
    section.appendChild(head);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'items';

    g.items.forEach(it=>{
      const div = document.createElement('div');
      div.className = 'item';
      div.dataset.search = it.lines.map(l=>l.label).join(' ').toLowerCase();

      const badge = document.createElement('div');
      badge.className = 'row-badge';
      badge.textContent = typeof it.row === 'number' ? toFaDigits(it.row) : toFaDigits(it.row);
      div.appendChild(badge);

      const body = document.createElement('div');
      body.className = 'item-body';

      const lines = document.createElement('div');
      lines.className = 'lines';
      it.lines.forEach(l=>{
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        const priceClass = (typeof l.price === 'string') ? 'line-price negotiable' : 'line-price';
        lineEl.innerHTML = `<span class="line-label">${l.label}</span><span class="${priceClass}">${formatPrice(l.price)}</span>`;
        lines.appendChild(lineEl);
      });
      body.appendChild(lines);

      if(it.note){
        const noteEl = document.createElement('div');
        noteEl.className = 'note';
        noteEl.textContent = it.note;
        body.appendChild(noteEl);
      }

      div.appendChild(body);
      itemsWrap.appendChild(div);
    });

    section.appendChild(itemsWrap);
    main.appendChild(section);
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  let visibleCount = 0;

  document.querySelectorAll('section.group').forEach(section=>{
    const key = section.dataset.key;
    const catMatch = (activeCat === 'all' || activeCat === key);
    let groupVisible = 0;

    section.querySelectorAll('.item').forEach(item=>{
      const text = item.dataset.search;
      const searchMatch = !q || text.includes(q);
      const show = catMatch && searchMatch;
      item.classList.toggle('hidden', !show);
      if(show){ groupVisible++; visibleCount++; }

      // highlight
      const labels = item.querySelectorAll('.line-label');
      labels.forEach(lbl=>{
        const original = lbl.dataset.original || lbl.textContent;
        lbl.dataset.original = original;
        if(q && show){
          const idx = original.toLowerCase().indexOf(q);
          if(idx !== -1){
            lbl.innerHTML = original.slice(0,idx) + '<mark>' + original.slice(idx, idx+q.length) + '</mark>' + original.slice(idx+q.length);
          } else {
            lbl.textContent = original;
          }
        } else {
          lbl.textContent = original;
        }
      });
    });

    section.classList.toggle('hidden', groupVisible === 0);
  });

  resultCount.textContent = q ? `${toFaDigits(visibleCount)} نتیجه یافت شد` : '';
  noResult.classList.toggle('show', visibleCount === 0);
}

renderCats();
renderItems();
applyFilter();
searchInput.addEventListener('input', applyFilter);
