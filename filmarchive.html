<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>آرشیو فیلم و سریال | کافی‌نت طلوع سبزوار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4fa;
    --surface: #ffffff;
    --surface-2: #efebf8;
    --text: #1b1530;
    --muted: #6b6485;
    --line: #e2dcf0;
    --accent: #6d28d9;
    --accent-soft: #ede9fe;
    --marquee: #f5a524;
    --warn-bg: #fff6e5;
    --warn-line: #f5c46b;
    --warn-text: #8a5200;
    --ble: #0ea062;
    --eitaa: #e07b1a;
    --shadow: 0 14px 34px -18px rgba(60, 24, 120, .35);
    --glow-a: rgba(109, 40, 217, .16);
    --glow-b: rgba(245, 165, 36, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0c1c;
      --surface: #19152b;
      --surface-2: #221c3a;
      --text: #f2eefc;
      --muted: #a69fc2;
      --line: #2f2850;
      --accent: #a78bfa;
      --accent-soft: #2a2150;
      --warn-bg: #2a2010;
      --warn-line: #6b4d16;
      --warn-text: #ffd48a;
      --shadow: 0 16px 36px -18px rgba(0, 0, 0, .8);
      --glow-a: rgba(139, 92, 246, .22);
      --glow-b: rgba(245, 165, 36, .10);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(60rem 28rem at 85% -8%, var(--glow-a), transparent 60%),
      radial-gradient(50rem 26rem at 5% 105%, var(--glow-b), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    padding: 2.5rem 1.25rem 3rem;
  }

  .page { width: 100%; max-width: 760px; margin: 0 auto; }

  /* Hero */
  .hero { text-align: center; margin-bottom: 1.5rem; animation: rise .7s ease-out both; }
  .reel {
    width: 64px; height: 64px; margin: 0 auto 1rem;
    border-radius: 20px;
    background: linear-gradient(145deg, var(--accent), #4c1d95);
    display: grid; place-items: center;
    box-shadow: 0 12px 28px -10px rgba(109, 40, 217, .6), inset 0 0 0 2px rgba(255,255,255,.12);
  }
  .reel svg { width: 34px; height: 34px; color: #fff; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 800; line-height: 1.3; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .95rem; margin-top: .35rem; }
  .sub b { color: var(--marquee); font-weight: 700; }

  /* Notice */
  .notice {
    display: flex; align-items: center; gap: 12px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-inline-start: 4px solid var(--marquee);
    color: var(--warn-text);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: .88rem; font-weight: 500;
    margin-bottom: 1.25rem;
  }
  .notice svg { width: 22px; height: 22px; flex-shrink: 0; }

  /* Sections */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
  }
  .panel-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1rem; font-weight: 700;
    margin-bottom: 1rem;
  }
  .panel-title::before {
    content: ""; width: 6px; height: 22px; border-radius: 4px;
    background: linear-gradient(var(--marquee), var(--accent));
  }

  /* Gallery */
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gallery-item {
    display: block; overflow: hidden;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .gallery-item:hover, .gallery-item:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 14px 28px -16px rgba(109, 40, 217, .55);
  }
  .gallery-item img { width: 100%; height: auto; display: block; }
  .gallery-item.wide { grid-column: 1 / -1; border-color: var(--marquee); }

  /* Messenger buttons */
  .messenger-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .m-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 12px;
    border-radius: 14px;
    text-decoration: none; color: #fff;
    font-size: .92rem; font-weight: 700;
    transition: transform .2s ease, filter .2s ease;
  }
  .m-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .m-btn img { width: 26px; height: 26px; border-radius: 50%; object-fit: contain; background: rgba(255,255,255,.2); }
  .btn-ble   { background: linear-gradient(135deg, #12b673, var(--ble)); }
  .btn-eitaa { background: linear-gradient(135deg, #f0922f, var(--eitaa)); }

  /* Footer */
  .footer { display: flex; justify-content: center; margin-top: 1.5rem; }
  .home-link {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--accent);
    font-weight: 700; font-size: .92rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px 8px 10px;
    transition: background .2s, transform .2s;
  }
  .home-link:hover { background: var(--accent-soft); transform: translateY(-2px); }
  .home-icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .home-icon svg { width: 17px; height: 17px; }

  a:focus-visible { outline: 3px solid var(--marquee); outline-offset: 3px; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 520px) {
    .gallery { grid-template-columns: 1fr; }
    .messenger-btns { grid-template-columns: 1fr; }
    body { padding-top: 1.75rem; }
  }
</style>
</head>
